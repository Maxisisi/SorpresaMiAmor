<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todas nuestras fotos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="album-page">
    <header class="album-hero">
      <nav class="topbar album-topbar" aria-label="Navegacion principal">
        <a href="index.html" class="brand">Para mi Javi</a>
        <div class="nav-links">
          <a href="index.html">Inicio</a>
          <a href="index.html#recuerdos">Recuerdos</a>
          <a href="fotos.html" aria-current="page">Todas las fotos</a>
        </div>
      </nav>

      <section class="album-hero-content reveal">
        <p class="eyebrow">Nuestro baúl</p>
        <h1>Todas nuestras fotos.</h1>
        <p>
          Tenemos que sacarnos más fotos eh
        </p>
      </section>
    </header>

    <main class="album-main">
      <section class="album-summary reveal" aria-live="polite">
        <span id="photo-count">Cargando fotos...</span>
      </section>

      <section class="photo-timeline" id="photo-timeline" aria-label="Fotos ordenadas por fecha"></section>
    </main>

    <div class="photo-viewer" id="photo-viewer" aria-hidden="true">
      <button class="photo-viewer-close" type="button" aria-label="Cerrar foto">×</button>
      <button class="photo-viewer-nav photo-viewer-prev" type="button" aria-label="Foto anterior">‹</button>
      <figure class="photo-viewer-frame">
        <img src="" alt="" />
        <figcaption id="photo-viewer-date"></figcaption>
      </figure>
      <button class="photo-viewer-nav photo-viewer-next" type="button" aria-label="Foto siguiente">›</button>
    </div>

    <script src="fotos-data.js"></script>
    <script src="fotos.js"></script>
    <script src="script.js"></script>
  </body>
</html>
